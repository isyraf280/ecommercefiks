{% extends 'base.html' %}

{% block content %}
<div class="page-header">
  <div>
    <h1>{{ heading }}</h1>
  </div>
  <a href="{% url 'app:admin_kategori' %}" style="background:#f1f5f9;color:#334155;padding:10px 20px;border-radius:8px;font-weight:600;font-size:0.92rem;text-decoration:none;">← Kembali</a>
</div>

<div class="content-card" style="max-width:500px;">
  <div style="text-align:center;padding:16px 0;">
    <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
    <h2 style="color:#991b1b;margin-bottom:8px;">Hapus Kategori?</h2>
    <p style="color:#475569;">Anda akan menghapus kategori:</p>
    <p style="font-size:1.1rem;font-weight:700;color:#0f172a;margin:8px 0 16px;">{{ kategori.nama }}</p>
    <p style="color:#64748b;font-size:0.88rem;">Produk dalam kategori ini tidak dihapus, namun kategorinya akan menjadi kosong.</p>
  </div>
  <form method="post" style="display:flex;gap:12px;justify-content:center;margin-top:12px;">
    {% csrf_token %}
    <button type="submit" style="background:#dc2626;color:white;padding:10px 24px;border:none;border-radius:8px;font-weight:700;cursor:pointer;">Ya, Hapus</button>
    <a href="{% url 'app:admin_kategori' %}" style="background:#e2e8f0;color:#334155;padding:10px 24px;border-radius:8px;font-weight:600;text-decoration:none;">Batal</a>
  </form>
</div>
{% endblock %}
